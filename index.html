<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Họp Tổ Chuyên Môn Tin - Ngoại Ngữ</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --paper: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; }
    
    /* Sidebar danh sách trang họp */
    .sidebar {
      width: 300px; background: #1e293b; color: white; display: flex; flex-direction: column;
      border-right: 4px solid #334155;
    }
    .sidebar-header { padding: 20px; background: #0f172a; border-bottom: 1px solid #334155; }
    .sidebar-header h2 { margin: 0; font-size: 18px; color: #38bdf8; }
    .sidebar-header p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; }
    .nav-actions { padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid #334155; }
    .btn {
      padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
      font-size: 13px; transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-report { background: #475569; color: white; }
    .btn-report:hover { background: #64748b; }
    
    .meeting-list { flex: 1; overflow-y: auto; padding: 10px; }
    .meeting-item {
      padding: 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer;
      background: #334155; transition: 0.2s; border-left: 4px solid transparent;
    }
    .meeting-item:hover { background: #475569; }
    .meeting-item.active { background: #2563eb; border-left-color: #38bdf8; }
    .meeting-item .date { font-size: 11px; color: #cbd5e1; }
    .meeting-item .title { font-weight: 600; font-size: 14px; margin-top: 4px; }

    /* Vùng nội dung trang sổ */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; }
    .notebook-page {
      background: var(--paper); width: 100%; max-width: 900px; min-height: 100%;
      padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border-left: 12px solid #e2e8f0; position: relative;
    }
    .page-header { border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
    .page-header h1 { margin: 0; font-size: 24px; color: var(--primary); }
    .page-meta { display: flex; gap: 20px; margin-top: 8px; font-size: 14px; color: #64748b; }
    
    .section { margin-bottom: 25px; }
    .section h3 { font-size: 16px; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 12px; }
    .content-box {
      background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid var(--border);
      white-space: pre-line; line-height: 1.6;
    }

    /* Khu vực điểm danh */
    .checkin-box {
      background: #eff6ff; border: 1px solid #bfdbfe; padding: 20px; border-radius: 8px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    select, input, textarea {
      padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    select { flex: 1; min-width: 220px; }
    .btn-checkin { background: var(--success); color: white; padding: 10px 20px; font-size: 14px; }
    .btn-checkin:hover { background: #15803d; }

    /* Bảng danh sách & Báo cáo */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    .badge-present { background: #dcfce7; color: var(--success); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
    .badge-absent { background: #fee2e2; color: var(--danger); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }

    /* Modal tạo cuộc họp */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .loading { text-align: center; padding: 40px; font-weight: 600; color: var(--primary); }
  </style>
</head>
<body>

  <!-- Cột trái: Mục lục các trang họp -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>SỔ HỌP CHUYÊN MÔN</h2>
      <p>Tổ Tin học - Ngoại ngữ</p>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Trang họp mới</button>
      <button class="btn btn-report" onclick="renderReport()">Báo cáo</button>
    </div>
    <div class="meeting-list" id="meetingList">
      <div style="padding: 15px; color: #94a3b8; font-size: 13px;">Đang tải dữ liệu...</div>
    </div>
  </div>

  <!-- Cột phải: Nội dung từng trang sổ -->
  <div class="main-content">
    <div class="notebook-page" id="notebookPage">
      <div class="loading">Đang kết nối dữ liệu Google Sheets...</div>
    </div>
  </div>

  <!-- Modal thêm cuộc họp mới -->
  <div class="modal" id="newMeetingModal">
    <div class="modal-content">
      <h3 style="margin:0;">Tạo trang họp mới</h3>
      <input type="text" id="inTieuDe" placeholder="Tiêu đề cuộc họp (VD: Họp chuyên môn tháng 11)">
      <input type="date" id="inNgayHop">
      <textarea id="inNoiDung" rows="4" placeholder="Nội dung chính cuộc họp..."></textarea>
      <input type="text" id="inTaiNguyen" placeholder="Link tài nguyên (Google Drive, Slide, Biên bản...)">
      <div style="display:flex; gap:10px; justify-content: flex-end; margin-top: 10px;">
        <button class="btn" onclick="closeModal()">Hủy</button>
        <button class="btn btn-primary" style="flex:none;" onclick="createMeeting()">Lưu trang họp</button>
      </div>
    </div>
  </div>

<script>
  // DÁN URL APPS SCRIPT CỦA BẠN VÀO DƯỚI ĐÂY
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyv3ECQE5YeQp4H3uskN2THbLfXLwTLbTtUiIB3qXdNLHKbWFLkGknK4a3_k43O9Dae/exec';

  let appData = { thanhVien: [], cuocHop: [], diemDanh: [] };
  let currentMaHop = null;

  // Tải toàn bộ dữ liệu từ Google Sheets
  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL);
      appData = await res.json();
      renderSidebar();
      if (appData.cuocHop.length > 0) {
        const target = currentMaHop || appData.cuocHop[appData.cuocHop.length - 1].MaHop;
        selectMeeting(target);
      } else {
        document.getElementById('notebookPage').innerHTML = '<p>Chưa có cuộc họp nào. Hãy nhấn "+ Trang họp mới" để bắt đầu.</p>';
      }
    } catch (err) {
      document.getElementById('notebookPage').innerHTML = '<p style="color:red;">Lỗi kết nối Google Sheets. Vui lòng kiểm tra lại SCRIPT_URL.</p>';
    }
  }

  // Hiển thị danh sách cuộc họp bên trái
  function renderSidebar() {
    const listEl = document.getElementById('meetingList');
    listEl.innerHTML = '';
    // Đảo ngược để cuộc họp mới nhất lên đầu
    [...appData.cuocHop].reverse().forEach(ch => {
      const div = document.createElement('div');
      div.className = `meeting-item ${ch.MaHop === currentMaHop ? 'active' : ''}`;
      div.onclick = () => selectMeeting(ch.MaHop);
      div.innerHTML = `
        <div class="date">Ngày: ${formatDate(ch.NgayHop)}</div>
        <div class="title">${ch.TieuDe}</div>
      `;
      listEl.appendChild(div);
    });
  }

  // Hiển thị chi tiết 1 trang cuộc họp
  function selectMeeting(maHop) {
    currentMaHop = maHop;
    renderSidebar();
    const ch = appData.cuocHop.find(x => x.MaHop === maHop);
    if (!ch) return;

    const ddList = appData.diemDanh.filter(x => x.MaHop === maHop);
    const presentIds = ddList.map(x => x.MaGV);

    // Tạo danh sách option cho dropdown điểm danh
    const optionsHtml = appData.thanhVien.map(tv => {
      const isChecked = presentIds.includes(tv.MaGV);
      return `<option value="${tv.MaGV}" ${isChecked ? 'disabled' : ''}>
        ${tv.HoTen} (${tv.Email}) ${isChecked ? '✓ Đã điểm danh' : ''}
      </option>`;
    }).join('');

    // Tạo bảng trạng thái điểm danh toàn tổ
    const rowsHtml = appData.thanhVien.map((tv, idx) => {
      const record = ddList.find(x => x.MaGV === tv.MaGV);
      return `
        <tr>
          <td>${idx + 1}</td>
          <td><b>${tv.HoTen}</b></td>
          <td>${tv.Email}<br><small>${tv.SoDienThoai}</small></td>
          <td>${record ? `<span class="badge-present">Có mặt (${record.ThoiGian})</span>` : `<span class="badge-absent">Vắng / Chưa xác nhận</span>`}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('notebookPage').innerHTML = `
      <div class="page-header">
        <h1>${ch.TieuDe}</h1>
        <div class="page-meta">
          <span>📅 Ngày họp: <b>${formatDate(ch.NgayHop)}</b></span>
          <span>👥 Sĩ số: <b>${ddList.length}/${appData.thanhVien.length}</b> thành viên</span>
        </div>
      </div>

      <div class="section">
        <h3>1. Điểm danh xác nhận tham gia</h3>
        <div class="checkin-box">
          <select id="selectGV">
            <option value="">-- Chọn tên của bạn để điểm danh --</option>
            ${optionsHtml}
          </select>
          <button class="btn btn-checkin" id="btnCheckin" onclick="submitCheckin()">✓ Xác nhận có mặt</button>
        </div>
      </div>

      <div class="section">
        <h3>2. Nội dung cuộc họp</h3>
        <div class="content-box">${ch.NoiDung || 'Chưa cập nhật nội dung.'}</div>
      </div>

      <div class="section">
        <h3>3. Tài nguyên đính kèm</h3>
        <div class="content-box">
          ${ch.TaiNguyen ? `<a href="${ch.TaiNguyen}" target="_blank">${ch.TaiNguyen}</a>` : 'Không có tài nguyên đính kèm.'}
        </div>
      </div>

      <div class="section">
        <h3>4. Bảng theo dõi chuyên cần buổi họp</h3>
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>Họ và tên</th>
              <th>Liên hệ</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  // Gửi dữ liệu điểm danh lên Google Sheets
  async function submitCheckin() {
    const maGV = document.getElementById('selectGV').value;
    if (!maGV) return alert('Vui lòng chọn tên của bạn trong danh sách!');
    
    const tv = appData.thanhVien.find(x => x.MaGV === maGV);
    const btn = document.getElementById('btnCheckin');
    btn.disabled = true;
    btn.innerText = 'Đang lưu...';

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'diemDanh',
        maHop: currentMaHop,
        maGV: tv.MaGV,
        hoTen: tv.HoTen
      })
    });
    const result = await res.json();
    if (result.status === 'success') {
      await loadData();
    } else {
      alert(result.message);
      btn.disabled = false;
      btn.innerText = '✓ Xác nhận có mặt';
    }
  }

  // Hiển thị trang Báo cáo tổng hợp
  function renderReport() {
    currentMaHop = null;
    renderSidebar();
    const totalMembers = appData.thanhVien.length;

    const reportRows = appData.cuocHop.map((ch, idx) => {
      const ddList = appData.diemDanh.filter(x => x.MaHop === ch.MaHop);
      const presentIds = ddList.map(x => x.MaGV);
      const absentNames = appData.thanhVien
        .filter(tv => !presentIds.includes(tv.MaGV))
        .map(tv => tv.HoTen)
        .join(', ');

      return `
        <tr>
          <td>${idx + 1}</td>
          <td><b>${ch.TieuDe}</b><br><small>${formatDate(ch.NgayHop)}</small></td>
          <td><b>${ddList.length}/${totalMembers}</b></td>
          <td style="color:#dc2626; font-size:13px;">${absentNames || 'Đủ sĩ số'}</td>
          <td style="font-size:13px;">${ch.NoiDung}</td>
          <td>${ch.TaiNguyen ? `<a href="${ch.TaiNguyen}" target="_blank">Mở link</a>` : '-'}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('notebookPage').innerHTML = `
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1>BÁO CÁO TỔNG HỢP SINH HOẠT CHUYÊN MÔN</h1>
          <div class="page-meta">Tổng số cuộc họp đã tổ chức: <b>${appData.cuocHop.length}</b></div>
        </div>
        <button class="btn btn-primary" style="flex:none;" onclick="window.print()">🖨️ In / Xuất PDF</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Cuộc họp</th>
            <th>Tham gia</th>
            <th>Vắng mặt</th>
            <th>Nội dung tóm tắt</th>
            <th>Tài nguyên</th>
          </tr>
        </thead>
        <tbody>${reportRows}</tbody>
      </table>
    `;
  }

  // Xử lý Modal tạo cuộc họp mới
  function openModal() { document.getElementById('newMeetingModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('newMeetingModal').style.display = 'none'; }

  async function createMeeting() {
    const tieuDe = document.getElementById('inTieuDe').value.trim();
    const ngayHop = document.getElementById('inNgayHop').value;
    const noiDung = document.getElementById('inNoiDung').value.trim();
    const taiNguyen = document.getElementById('inTaiNguyen').value.trim();

    if (!tieuDe || !ngayHop) return alert('Vui lòng nhập tiêu đề và ngày họp!');

    closeModal();
    document.getElementById('notebookPage').innerHTML = '<div class="loading">Đang tạo trang họp mới...</div>';

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'themCuocHop',
        tieuDe, ngayHop, noiDung, taiNguyen
      })
    });
    const result = await res.json();
    if (result.status === 'success') {
      currentMaHop = result.maHop;
      await loadData();
    }
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  }

  // Khởi chạy
  loadData();
</script>
</body>
</html>
